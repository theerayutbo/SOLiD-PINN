name: PyBaMM reference
on:
  pull_request:
    paths:
      - 'src/solid_pinn/**'
      - 'scripts/verify_pybamm.py'
      - '.github/workflows/pybamm-reference.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]' 'pybamm==25.10.2'
      - run: python -c 'import pybamm; print(pybamm.__version__)'
      - run: python scripts/verify_pybamm.py --out outputs/pybamm_verification.csv
      - uses: actions/upload-artifact@v4
        with:
          name: pybamm-verification
          path: outputs/pybamm_verification.csv
